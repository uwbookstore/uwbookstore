<script>
  (function () {
    // 1. Clean the current URL (removes query params like ?ref=, ?utm_source=, and hashes)
    const canonicalUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;

    // 2. Look for an existing canonical tag
    let canonicalLink = document.querySelector('link[rel="canonical"]');

    if (canonicalLink) {
      // Update the existing tag
      canonicalLink.setAttribute('href', canonicalUrl);
    } else {
      // Create a brand new tag if it doesn't exist
      canonicalLink = document.createElement('link');
      canonicalLink.setAttribute('rel', 'canonical');
      canonicalLink.setAttribute('href', canonicalUrl);
      document.head.appendChild(canonicalLink);
    }
  })();
</script>
